server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker + variable: nginx arranca aunque la API esté caída
    # (sin esto, un upstream que no resuelve impide levantar el sitio entero).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $catalogo_api http://cesarbritez-api:3000;

    # Compresión
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Seguridad mínima (se repite en cada location con add_header propio)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API del catálogo (Node, solo lectura) ─────────────────
    location /api/ {
        proxy_pass         $catalogo_api;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # ── Imágenes de productos: volumen de uploads de aberturas montado :ro ──
    # Solo /uploads/productos: el resto del volumen (adjuntos, comprobantes) NO se publica.
    location /uploads/productos/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /uploads/ { return 404; }

    # JS y CSS sin "immutable": no llevan hash en el nombre y cambian con cada deploy.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
